AllCops:
  TargetRubyVersion: 2.6
  Include:
    - '**/*.rb'
    - '**/*.gemfile'
    - '**/*.gemspec'
    - '**/*.rake'
    - '**/*.ru'
    - '**/Gemfile'
    - '**/Rakefile'
  Exclude:
    - 'db/**/*'
    - 'config/**/*'
    - 'script/**/*'
    - 'bin/{bundle,rails,rake,setup,spring,update}'
    - 'bin/**/*'
    - 'lib/tasks/test_emails.rake'
    - 'test/*.rb'
Style/FrozenStringLiteralComment:
  Enabled: false
Metrics/LineLength:
  Max: 200
Metrics/CyclomaticComplexity:
  Max: 15
Metrics/AbcSize:
  Max: 20
Metrics/MethodLength:
  Max: 20
Layout/LineLength:
  Max: 200
Documentation:
  Enabled: false
GlobalVars:
  AllowedVariables:
    - $SITE_NAME
Style/ClassAndModuleChildren:
  Enabled: false
